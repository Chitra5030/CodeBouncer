<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0d1730"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="translate(250 140) rotate(45) scale(420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f7cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(1050 560) rotate(220) scale(420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3a6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a3866" stroke-opacity="0.25" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- eyebrow -->
  <text x="80" y="150" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#7c9cff">🚫  AI SUPPLY-CHAIN SECURITY</text>

  <!-- headline -->
  <text x="80" y="250" font-family="Sora, Inter, Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff">Stop AI from installing</text>
  <text x="80" y="338" font-family="Sora, Inter, Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff">malware into your code</text>

  <!-- subline -->
  <text x="80" y="412" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="500" fill="#aeb9d6">The bouncer for AI-suggested code — blocks hallucinated,</text>
  <text x="80" y="454" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="500" fill="#aeb9d6">typosquatted &amp; malicious packages before they install.</text>

  <!-- verdict chips -->
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="22" font-weight="600">
    <rect x="80" y="510" width="172" height="52" rx="12" fill="#0f2a1f" stroke="#1f7a52"/>
    <text x="104" y="544" fill="#34d399">✓ express</text>

    <rect x="268" y="510" width="150" height="52" rx="12" fill="#2a230f" stroke="#7a5a1f"/>
    <text x="292" y="544" fill="#fbbf24">~ lodahs</text>

    <rect x="434" y="510" width="246" height="52" rx="12" fill="#2a0f12" stroke="#7a1f29"/>
    <text x="458" y="544" fill="#f87171">✕ reqwest-utils</text>
  </g>

  <!-- wordmark -->
  <text x="1120" y="585" text-anchor="end" font-family="Sora, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">CodeBouncer</text>
  <text x="1120" y="150" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#7c9cff">codebouncer.online</text>
</svg>
