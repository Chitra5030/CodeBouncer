<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="CodeBouncer intercepts AI-suggested packages in real time and blocks hallucinated, typosquatted, or malicious dependencies before they are installed."
    />
    <title>CodeBouncer — The bouncer for AI-suggested code</title>
  </head>
  <body>
    <script>
      // Default to dark for new visitors, but remember a returning visitor's choice.
      (function () {
        try {
          var t = localStorage.getItem("cb-theme") || "dark";
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
