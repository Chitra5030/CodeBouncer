name: Keep Render awake

# Pings the live health endpoint so the Render free instance never idles into sleep.
# Render free services spin down after ~15 min of no traffic, so we ping every 10 min.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (UTC)
  workflow_dispatch: {} # allows manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping CodeBouncer health endpoint
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://codebouncer.online/api/health; then
              echo ""
              echo "Ping succeeded on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed (server may be waking up); retrying in 20s..."
            sleep 20
          done
          echo "All ping attempts failed."
          exit 1
